<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – Tugon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/account_pages.css">
</head>
<body>
  <main class="auth">
    <a class="auth__logo" href="../index.html" aria-label="Tugon home">
      <div class="crop logo-text"><img src="../assets/Logo/tugon-logo-sheet.png" alt=""></div>
    </a>

    <!-- Sign up, step 3 -->
    <section class="auth-box auth-box--signup auth-box--step-3" aria-labelledby="signup-title">
      <div class="auth-heading auth-heading--spaced">
        <h1 class="auth-title" id="signup-title">Sign Up</h1>
        <p class="auth-subtitle">Finished!</p>
      </div>

      <img class="auth-check" src="../assets/Icons/icon-check-mark.png" alt="">

      <div class="auth-actions">
        <a class="blue-button" href="login.html">
          <picture>
            <source media="(max-width: 48rem)" srcset="../assets/Buttons/blue-button-box-mobile.svg">
            <img class="blue-button__box" src="../assets/Buttons/blue-button-box.svg" alt="">
          </picture>
          <span class="blue-button__label">Log In</span>
        </a>
        <a class="text-link text-link--red" href="../index.html">Exit</a>
      </div>
    </section>
  </main>
</body>
</html>
